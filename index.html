<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For You ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a0008; /* Deep romantic dark red/black */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeIn 2s ease-in forwards;
    }

    /* Beating heart animation */
    .heart-btn {
      font-size: 4rem;
      text-decoration: none;
      animation: heartbeat 1.5s infinite;
      cursor: pointer;
      display: inline-block;
      transition: transform 0.3s;
    }

    .heart-btn:hover {
      transform: scale(1.2);
    }

    p {
      margin-top: 20px;
      font-size: 1rem;
      color: #ff99b3;
      opacity: 0;
      animation: fadeIn 2s ease-in 1s forwards; /* Fades in after the title */
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      15% { transform: scale(1.3); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
      60% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <h1>For My Special One ✨</h1>
  
  <!-- This links to your next page -->
  <a href="menu.html" class="heart-btn">❤️</a>
  
  <p>Tap the heart to open</p>

</body>
</html>
